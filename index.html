<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day - Mahesh</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- Background -->
<div class="stars"></div>
<div class="hearts"></div>

<!-- Music -->

<audio id="bgmusic" controls loop>
    <source src="Happydays.mp3" type="audio/mpeg">
</audio>


    

<!-- Main Container -->
<div class="container">

    <!-- Mahesh Animation -->
    <h1 id="mahesh">
        MAHESH
    </h1>

    <!-- Heading -->
    <h2 class="heading">
        🎉 HAPPY FRIENDSHIP DAY 🎉
    </h2>

    <!-- Message -->
    <p id="message"></p>

    <!-- From -->
    <h3 class="from">
        ❤️ From Mahesh ❤️
    </h3>

    <!-- Image -->
    <div class="photo-box">
        <img src="friend.jpg" alt="Mahesh">
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
